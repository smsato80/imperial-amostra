<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Imperial Select | Veículos, conectividade, traduções e Drive School no Japão</title>
<meta name="description" content="Automóveis, internet, traduções e assessoria para habilitação, com atendimento em português em todo o Japão.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --preto:#0B0D10; --grafite:#1A1E24; --grafite2:#22272F; --branco:#F5F3EE;
  --dourado:#B89A5A; --dourado-claro:#D6BC7E; --cinza:#8D949D; --cinza-claro:#C9CDD3;
  --linha:rgba(245,243,238,.09); --linha-forte:rgba(245,243,238,.16);
  --fonte-titulo:"Manrope","Noto Sans JP",sans-serif;
  --fonte-texto:"Inter","Noto Sans JP",sans-serif;
  --raio:14px; --max:1280px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--preto);color:var(--branco);font-family:var(--fonte-texto);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--fonte-titulo);line-height:1.14;letter-spacing:-.01em}
.micro{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--dourado);display:flex;align-items:center;gap:12px}
.micro::before{content:"";width:32px;height:1px;background:var(--dourado);flex:0 0 auto}
section{padding:104px 0}
section[id]{scroll-margin-top:100px}
.sec-head{max-width:720px;margin-bottom:48px}
.sec-head h2{font-size:clamp(32px,4.4vw,46px);font-weight:800;margin:16px 0 14px}
.sec-head p{color:var(--cinza-claro);font-size:17px}

.opcoes{display:flex;gap:10px;flex-wrap:wrap}
.opcoes button{flex:1 1 0;background:var(--preto);border:1px solid var(--linha-forte);color:var(--branco);font:inherit;font-weight:600;font-size:15.5px;padding:13px 10px;border-radius:10px;cursor:pointer;transition:border-color .2s,background .2s}
.opcoes.pills button{flex:0 1 auto;padding:10px 18px}
.opcoes button.sel{border-color:var(--dourado);background:rgba(184,154,90,.16);color:var(--dourado-claro)}
.campo.erro input,.campo.erro select{border-color:#D66 !important}
.campo.erro .opcoes button{border-color:rgba(221,102,102,.55)}
.ex-grupo{font-family:var(--fonte-titulo);font-weight:700;font-size:15px;color:var(--dourado-claro);margin:22px 0 2px;padding-top:18px;border-top:1px solid var(--linha)}
.hero-tel{flex-wrap:wrap}
.hero-tel b{white-space:nowrap}
.hotspot{font:inherit;background:transparent;border:0;cursor:pointer}
@media(max-width:640px){section[id]{scroll-margin-top:88px}}

/* ---------- header ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:60;transition:background .35s,border-color .35s,box-shadow .35s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(11,13,16,.92);backdrop-filter:blur(12px);border-bottom-color:var(--linha)}
.header-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:88px;display:flex;align-items:center;gap:28px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;flex:0 0 auto}
.marca img{height:64px;width:auto;object-fit:contain}
.marca .wm{line-height:1.05}
.marca .wm b{font-family:var(--fonte-titulo);font-weight:800;font-size:16.5px;letter-spacing:.22em;display:block}
.marca .wm span{font-size:9.5px;font-weight:600;letter-spacing:.52em;color:var(--dourado);display:block;margin-top:3px}
nav.principal{display:flex;gap:26px;margin-left:auto}
nav.principal a{text-decoration:none;font-size:13.5px;font-weight:600;letter-spacing:.04em;color:var(--cinza-claro);padding:6px 2px;border-bottom:2px solid transparent;transition:color .25s,border-color .25s}
nav.principal a:hover,nav.principal a.ativa{color:var(--branco);border-bottom-color:var(--dourado)}
.langs{position:relative;flex:0 0 auto}
.langs button{font-family:inherit;cursor:pointer}
.langs-trigger{display:flex;align-items:center;gap:7px;border:1px solid var(--linha-forte);border-radius:999px;background:rgba(11,13,16,.9);color:var(--branco);padding:7px 11px;font-size:12px;font-weight:700}
.langs-trigger:hover,.langs-trigger[aria-expanded="true"]{border-color:var(--dourado)}
.langs-flag{width:22px;height:15px;flex:0 0 auto;border-radius:2px}
.langs-current{display:flex;align-items:center;gap:7px}
.langs-arrow{width:12px;height:12px;flex:0 0 auto}
.langs-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:155px;padding:5px;background:#111318;border:1px solid var(--linha-forte);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.langs-menu[hidden]{display:none}
.langs-menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;border-radius:6px;background:transparent;color:var(--cinza-claro);text-align:left;padding:9px 10px;font-size:13px}
.langs-menu button:hover,.langs-menu button.ativa{background:rgba(201,164,83,.16);color:var(--dourado-claro)}
.langs button:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--fonte-texto);font-weight:700;font-size:15px;text-decoration:none;border-radius:999px;padding:13px 24px;cursor:pointer;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s,transform .25s;line-height:1.2}
.btn-ouro{background:var(--dourado);color:#14161a}
.btn-ouro:hover{background:var(--dourado-claro)}
.btn-linha{border-color:rgba(245,243,238,.35);color:var(--branco);background:rgba(11,13,16,.25)}
.btn-linha:hover{border-color:var(--branco);background:rgba(245,243,238,.06)}
.btn-cta-header{padding:10px 18px;font-size:13.5px}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.menu-btn{display:none;margin-left:auto;background:transparent;border:1px solid var(--linha-forte);border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center;color:var(--branco);cursor:pointer}
.menu-btn svg{width:21px;height:21px}
.menu-mobile{display:none;border-top:1px solid var(--linha);background:rgba(11,13,16,.97);padding:10px 24px 22px}
.menu-mobile a{display:block;padding:13px 2px;text-decoration:none;font-weight:600;font-size:16px;border-bottom:1px solid var(--linha);color:var(--cinza-claro)}
.menu-mobile a:last-of-type{border-bottom:0}
.menu-mobile .langs{margin-top:14px;width:max-content}
header.menu-aberto .menu-mobile{display:block}
/* ---------- hero ---------- */
.hero{position:relative;padding:88px 0 0;background:var(--preto)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero-content{position:relative;max-width:1920px;margin:0 auto}
.hero-scene{position:relative;isolation:isolate;aspect-ratio:1672/941;overflow:hidden}
.hero-photo{width:100%;height:auto}
.hero-scene::before,.hero-scene::after{content:"";position:absolute;pointer-events:none}
/* Conceal the two marks baked into the reference without altering the source image. */
.hero-scene::before{inset:0 auto auto 1.5%;width:23%;height:33%;background:linear-gradient(110deg,#010e1f 18%,#061b3a 69%,#1d2041);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 82%,transparent),linear-gradient(#000 90%,transparent);mask-composite:intersect}
.hero-scene::after{left:81%;top:1%;width:18%;height:27.6%;clip-path:polygon(0 0,100% 0,100% 92%,0 100%);background:linear-gradient(155deg,#080c14,#0a162d 85%);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(transparent,#000 14%,#000 92%,transparent);mask-composite:intersect}
.hero-logo{position:absolute;z-index:1;height:auto;mix-blend-mode:screen}
.hero-logo-left{left:4.2%;top:-1.3%;width:16.7%}
.hero-logo-wall{left:83%;top:.5%;width:13.3%;transform:skewY(-3deg)}
.hero-copy{position:relative;padding:0 20px;text-shadow:0 2px 10px #060a13}
.hero-copy .micro{margin-bottom:10px;letter-spacing:.13em;color:var(--dourado-claro)}
.hero-title{font-size:clamp(27px,7vw,43px);font-weight:800;line-height:1.13;text-wrap:balance}
.hero-title .hero-highlight{color:var(--dourado-claro);white-space:nowrap}
html[lang="ja"] .hero-title{letter-spacing:0;line-break:strict;word-break:normal}
.hero-copy .sub{margin-top:12px;color:var(--branco);font-size:16px;line-height:1.45}
.hero-copy .hero-ctas{margin-top:18px}
.hero-copy .hero-tel{margin-top:15px}
.hero-links{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:18px 20px 22px}
.hero-links a{display:flex;align-items:center;gap:8px;border:1px solid var(--linha-forte);border-radius:12px;padding:12px 10px;text-decoration:none;font-weight:700;font-size:14px;color:var(--branco);overflow-wrap:anywhere}
.hero-links svg{width:19px;height:19px;color:var(--dourado-claro);flex:0 0 auto}
.hero-links a:hover{background:rgba(11,16,25,.82);border-color:var(--dourado)}
@media(min-width:360px) and (max-width:390px){
  html[lang="ja"] .hero-links a[href="#driveschool"]{font-size:13px;gap:6px}
}
@media(max-width:1023px){
  /* Extend the reflective foreground under the copy while keeping the full photo at the top. */
  .hero-content::before{content:"";position:absolute;inset:calc(56.28vw - 72px) 0 0;pointer-events:none;background:linear-gradient(90deg,rgba(3,12,24,.8),rgba(3,12,24,.65)),url("assets/hero-imperial-sem-textos.png") center bottom/100% 440% no-repeat;background-image:linear-gradient(90deg,rgba(3,12,24,.8),rgba(3,12,24,.65)),image-set(url("assets/hero-imperial-sem-textos.webp") type("image/webp"),url("assets/hero-imperial-sem-textos.png") type("image/png"));mask-image:linear-gradient(transparent,#000 72px);z-index:1}
  .hero-copy,.hero-links{z-index:2}
  .hero-copy{margin-top:clamp(-35px,-7vw,-24px)}
  .hero-copy .hero-ctas{gap:8px}
  .hero-copy .btn{padding:11px 16px;text-shadow:none}
  .hero-links a{background:rgba(7,15,27,.62)}
}
@media(min-width:1024px){
  .hero-content::after{content:"";position:absolute;inset:22% 0 0;pointer-events:none;background:linear-gradient(90deg,rgba(1,10,22,.66),rgba(1,10,22,.4) 36%,transparent 57%);mask-image:linear-gradient(transparent,#000 9%);z-index:1}
  .hero-copy{position:absolute;top:28%;left:4.2%;width:43%;padding:0;background:none;z-index:2;text-shadow:0 2px 12px #060a13}
  .hero-title{font-size:clamp(29px,3.15vw,57px)}
  .hero-copy .sub{font-size:clamp(14px,1.28vw,21px);max-width:37em}
  .hero-copy .hero-ctas{gap:10px}
  .hero-copy .btn{padding:9px 13px;text-shadow:none}
  .hero-copy .hero-tel{margin-top:9px}
  .hero-links{position:absolute;bottom:4.8%;left:4.2%;right:4.2%;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0;z-index:2;background:rgba(7,15,27,.52);border-radius:12px}
  .hero-links a{justify-content:center;gap:12px;border-color:transparent;font-size:clamp(14px,1.28vw,23px)}
  .hero-links a + a{border-left-color:var(--linha-forte);border-radius:0}
  .hero-links a:hover{border-color:var(--dourado)}
  .hero-links svg{width:clamp(22px,2.1vw,36px);height:auto}
}
@media(min-width:1250px){
  .hero-copy .sub{max-width:38ch}
  .hero-copy .btn{padding:10px 16px;font-size:clamp(13px,1.15vw,19px)}
  .hero-links{bottom:11.7%}
}
#driveschool .duas-col > *{min-width:0}
#driveschool .passos{grid-template-columns:repeat(2,minmax(0,1fr));overflow-wrap:anywhere}
@media(max-width:480px){#driveschool .passos{grid-template-columns:1fr}}
.hero-ctas{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.hero-tel{margin-top:30px;display:flex;align-items:center;gap:10px;color:var(--cinza-claro);font-size:14.5px}
.hero-tel svg{width:17px;height:17px;color:var(--dourado)}
.hero-tel b{color:var(--branco);font-size:16.5px;letter-spacing:.02em}
@keyframes sobe{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero .anim{opacity:0;animation:sobe .8s cubic-bezier(.22,.7,.3,1) forwards}
.hero .anim.d1{animation-delay:.08s}.hero .anim.d2{animation-delay:.22s}.hero .anim.d3{animation-delay:.36s}.hero .anim.d4{animation-delay:.5s}.hero .anim.d5{animation-delay:.64s}
/* ---------- divisões ---------- */
#divisoes{padding-top:88px}
.grid-div{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card-div{position:relative;background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:border-color .3s}
.card-div:hover{border-color:rgba(184,154,90,.45)}
.card-div .foto{overflow:hidden;aspect-ratio:16/8.2}
.card-div .foto picture{display:block;width:100%;height:100%}
.card-div .foto img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,.7,.3,1)}
.card-div:hover .foto img{transform:scale(1.03)}
.card-div .corpo{padding:26px 28px 28px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-div .num{font-family:var(--fonte-titulo);font-size:12.5px;font-weight:800;letter-spacing:.2em;color:var(--dourado)}
.card-div h3{font-size:clamp(21px,2.4vw,25px);font-weight:800;display:flex;align-items:center;gap:12px}
.card-div h3 svg{width:22px;height:22px;color:var(--dourado);flex:0 0 auto}
.card-div p{color:var(--cinza-claro);font-size:15.5px;line-height:1.6}
.card-div .vai{margin-top:auto;padding-top:14px;display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--dourado-claro)}
.card-div .vai svg{width:16px;height:16px;transition:transform .3s}
.card-div:hover .vai svg{transform:translateX(5px)}
/* ---------- seções internas ---------- */
.alt{background:var(--grafite)}
.alt .servico{background:rgba(11,13,16,.35)}
.servicos{display:flex;flex-direction:column;border-top:1px solid var(--linha)}
.servico{display:flex;gap:20px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linha);color:inherit;font:inherit;padding:24px 10px;cursor:pointer;transition:background .25s}
.servico:hover{background:rgba(245,243,238,.03)}
.servico .ic{flex:0 0 auto;width:46px;height:46px;border:1px solid var(--linha-forte);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--dourado)}
.servico .ic svg{width:21px;height:21px}
.servico h3{font-size:19px;font-weight:700;margin-bottom:4px}
.servico p{color:var(--cinza);font-size:15px;line-height:1.6;max-width:56em}
.servico .seta{margin-left:auto;flex:0 0 auto;color:var(--cinza);padding-top:12px;transition:transform .3s,color .3s}
.servico:hover .seta{transform:translateX(5px);color:var(--dourado-claro)}
.servico .seta svg{width:19px;height:19px}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.cards-con{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card-con{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:26px;display:flex;flex-direction:column;gap:12px}
.card-con .ic{width:46px;height:46px;border:1px solid rgba(184,154,90,.35);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--dourado)}
.card-con .ic svg{width:21px;height:21px}
.card-con h3{font-size:19px}
.card-con p{color:var(--cinza-claro);font-size:15px;line-height:1.6;flex:1}
.card-con .btn{align-self:flex-start}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:8px}
.tipo{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:0;overflow:hidden;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:border-color .25s;display:flex;flex-direction:column}
.tipo img{width:100%;height:auto;aspect-ratio:2/1;object-fit:cover}
.tipo .txt{padding:16px 18px 18px;display:block}
.alt .tipo{background:rgba(11,13,16,.35)}
.tipo:hover{border-color:rgba(184,154,90,.45)}
.tipo h3{font-size:17.5px;margin-bottom:6px}
.tipo p{color:var(--cinza);font-size:14px;line-height:1.55}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-top:44px}
.passo{padding:28px 24px;border-right:1px solid var(--linha);background:rgba(245,243,238,.015)}
.passo:last-child{border-right:0}
.passo .n{font-family:var(--fonte-titulo);font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--dourado)}
.passo h3{font-size:18px;margin:12px 0 8px}
.passo p{color:var(--cinza);font-size:14.5px;line-height:1.6}
.notas{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px}
.nota{border-left:2px solid var(--dourado);padding:4px 0 4px 18px}
.nota h3{font-size:16.5px;margin-bottom:5px}
.nota p{color:var(--cinza);font-size:14.5px;line-height:1.6}
.aviso{margin-top:26px;color:var(--cinza);font-size:14px;border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px;line-height:1.6}
/* ---------- drive school ---------- */
.painel-sim{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:34px;position:sticky;top:104px}
.painel-sim h3{font-size:23px;margin-bottom:10px}
.painel-sim p{color:var(--cinza-claro);font-size:15.5px;line-height:1.65}
.painel-sim .btn{margin-top:22px;width:100%;justify-content:center}
.painel-sim .regra{display:flex;gap:14px;margin-top:24px;padding-top:22px;border-top:1px solid var(--linha)}
.painel-sim .regra .big{font-family:var(--fonte-titulo);font-size:30px;font-weight:800;color:var(--dourado);line-height:1}
.painel-sim .regra p{font-size:13.5px;color:var(--cinza)}
/* ---------- contato ---------- */
#contato{background:var(--grafite)}
.contato-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.contato-grid h2{font-size:clamp(30px,4vw,42px);margin:16px 0 14px}
.contato-grid .lead{color:var(--cinza-claro);font-size:17px;max-width:32em}
.tel-grande{font-family:var(--fonte-titulo);font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:.02em;margin:26px 0 6px}
.tel-label{color:var(--cinza);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.contato-ctas{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.qr-card{background:var(--preto);border:1px solid var(--linha);border-radius:var(--raio);padding:26px;text-align:center}
.qr-card img{width:172px;height:172px;margin:0 auto 14px;border-radius:10px}
.qr-card p{color:var(--cinza);font-size:13.5px;line-height:1.55}
/* ---------- rodapé ---------- */
footer{border-top:1px solid var(--linha);padding:64px 0 34px;background:var(--preto)}
.rodape-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:44px}
.rodape-grid img.logo-full{width:118px;height:auto;margin-bottom:16px}
.rodape-grid .slogan{font-family:var(--fonte-titulo);font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--dourado)}
.rodape-grid p{color:var(--cinza);font-size:14.5px;margin-top:12px;max-width:26em}
.rodape-grid h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza);margin-bottom:16px}
.rodape-grid ul{list-style:none}
.rodape-grid li{margin-bottom:10px}
.rodape-grid ul a{color:var(--cinza-claro);text-decoration:none;font-size:15px}
.rodape-grid ul a:hover{color:var(--branco)}
.direitos{margin-top:48px;padding-top:22px;border-top:1px solid var(--linha);color:var(--cinza);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
html[lang="ja"] main section:not(.hero) h2{line-break:strict;word-break:auto-phrase;text-wrap:balance}
/* ---------- modal ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(6px);z-index:90;display:none;align-items:flex-end;justify-content:center;padding:0}

.campo{margin-top:18px}

.opcoes button{min-height:48px}

  var extrasEl = document.getElementById("formExtras");
  function pt(k){ return (T.pt && T.pt[k]) || k; }
  function montarExtras(service, preservar){
    var campos = EXTRAS[service] || [];
    var valores = {};
    if(preservar){
      form.querySelectorAll("[data-excampo]").forEach(function(el){ valores[el.getAttribute("data-excampo")] = el.value; });
    }
    extrasEl.innerHTML = "";
    var eb0 = document.getElementById("formExtrasB");
    if(eb0) eb0.innerHTML = "";
    var ec0 = document.getElementById("formExtrasC");
    if(ec0) ec0.innerHTML = "";
    var ultimoGrupo = null;
    campos.forEach(function(c, idx){
      if(c.tipo === "nota"){
        var pn = document.createElement("p");
        pn.className = "ex-nota";
        pn.textContent = t(c.label);
        extrasEl.appendChild(pn);
        return;
      }
      if(c.grupo && c.grupo !== ultimoGrupo){
        var h = document.createElement("p");
        h.className = "ex-grupo";
        h.textContent = t("exDiagTitulo");
        extrasEl.appendChild(h);
        ultimoGrupo = c.grupo;
      }
      var id = "exCampo" + idx;
      var div = document.createElement("div");
      div.className = "campo";
      var lab = document.createElement("label");
      lab.setAttribute("for", id);
      lab.textContent = t(c.label);
      div.appendChild(lab);
      var salvo = valores[c.label] || "";
      if(!salvo && c.preset) salvo = (c.tipo === "select") ? c.preset : pt(c.preset);
      if(c.tipo === "select"){
        var input = document.createElement("select");
        input.id = id;
        var vazio = document.createElement("option");
        vazio.value = ""; vazio.textContent = t("exSelecione");
        input.appendChild(vazio);
        c.opts.forEach(function(ok){
          var op = document.createElement("option");
          op.value = ok; op.textContent = t(ok); op.setAttribute("data-pt", pt(ok));
          input.appendChild(op);
        });
        input.setAttribute("data-excampo", c.label);
        if(salvo) input.value = salvo;
        input.addEventListener("change", function(){ div.classList.remove("erro"); });
        div.appendChild(input);
      } else if(c.tipo === "toggle" || c.tipo === "pills"){
        if(c.tipo === "pills") div.classList.add("campo-pills");
        var hidden = document.createElement("input");
        hidden.type = "hidden"; hidden.id = id;
        hidden.setAttribute("data-excampo", c.label);
        var ops = document.createElement("div");
        ops.className = "opcoes" + (c.tipo === "pills" ? " pills" : "");
        c.opts.forEach(function(ok){
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = t(ok);
          b.setAttribute("data-pt", pt(ok));
          if(salvo && salvo === pt(ok)){ b.classList.add("sel"); hidden.value = salvo; }
          b.addEventListener("click", function(){
            var jaEra = b.classList.contains("sel");
            ops.querySelectorAll("button").forEach(function(x){ x.classList.remove("sel"); });
            if(c.tipo === "pills" && jaEra){ hidden.value = ""; }
            else { b.classList.add("sel"); hidden.value = b.getAttribute("data-pt"); }
            div.classList.remove("erro");
          });
          ops.appendChild(b);
        });
        div.appendChild(ops);
        div.appendChild(hidden);
      } else {
        var inp = document.createElement("input");
        inp.type = "text"; inp.id = id;
        if(c.ph) inp.placeholder = t(c.ph);
        inp.setAttribute("data-excampo", c.label);
        if(salvo) inp.value = salvo;
        inp.addEventListener("input", function(){ div.classList.remove("erro"); });
        div.appendChild(inp);
      }
      extrasEl.appendChild(div);
    });
    btnEnviar.querySelector("span").textContent = (service === "fibra") ? t("fEnviarFibra") : t("fEnviar");
    avaliarCond();
  }
  function avaliarCond(){
    var campos = EXTRAS[currentService] || [];
    var mapa = {};
    extrasEl.querySelectorAll("[data-excampo]").forEach(function(el){ mapa[el.getAttribute("data-excampo")] = el; });
    campos.forEach(function(c){
      if(!c.cond) return;
      var alvo = mapa[c.label], ctrl = mapa[c.cond.label];
      if(!alvo || !ctrl) return;
      var div = alvo.closest(".campo");
      if(div) div.style.display = (ctrl.value === c.cond.esconde) ? "none" : "";
    });
  }
  form.addEventListener("click", function(){ setTimeout(avaliarCond, 0); });
  form.addEventListener("change", function(){ avaliarCond(); });
  function mapaExtras(){
    var mapa = {};
    form.querySelectorAll("[data-excampo]").forEach(function(el){ mapa[el.getAttribute("data-excampo")] = el; });
    return mapa;
  }
  function validarExtras(){
    var campos = EXTRAS[currentService] || [];
    var mapa = mapaExtras();
    var ok = true, primeiro = null;
    campos.forEach(function(c){
      if(!c.req || c.tipo === "nota") return;
      var el = mapa[c.label];
      if(!el) return;
      var div = el.closest(".campo");
      if(div && div.style.display === "none") return;
      if(!el.value || !el.value.trim()){
        ok = false;
        if(div){ div.classList.add("erro"); if(!primeiro) primeiro = div; }
      }
    });
    if(!ok && primeiro) primeiro.scrollIntoView({block: "center", behavior: "smooth"});
    return ok;
  }
  function coletarExtras(){
    var campos = EXTRAS[currentService] || [];
    var mapa = mapaExtras();
    var partes = [];
    campos.forEach(function(c){
      if(c.tipo === "nota") return;
      var el = mapa[c.label];
      if(!el || !el.value || !el.value.trim()) return;
      var div = el.closest(".campo");
      if(div && div.style.display === "none") return;
      var valor = el.value;
      if(el.tagName === "SELECT"){
        var op = el.options[el.selectedIndex];
        valor = op ? (op.getAttribute("data-pt") || op.textContent) : valor;
      }
      partes.push(pt(c.label) + ": " + valor);
    });
    return partes.join(" | ");
  }

  /* ---------- medição de conversão (instrumentação preparada; nenhuma ferramenta
     de analytics está configurada no momento e nenhum dado pessoal é enviado) ---------- */
  window.dataLayer = window.dataLayer || [];
  function imperialEvento(nome, dados){
    var ev = { event: nome, idioma: currentLang };
    if(dados){ for(var k in dados) ev[k] = dados[k]; }
    window.dataLayer.push(ev);
  }
  document.querySelectorAll('a[href*="wa.me"]').forEach(function(a){
    a.addEventListener("click", function(){ imperialEvento("whatsapp_click", {}); });
  });

  /* ---------- validação inline (sem alert) ---------- */
  var formErro = document.getElementById("formErro");
  function mostrarErro(msg, campoEl){
    formErro.textContent = msg;
    formErro.hidden = false;
    if(campoEl){ campoEl.focus({ preventScroll: false }); }
  }
  function limparErro(){ formErro.hidden = true; formErro.textContent = ""; }
  function marcarErro(el, ruim){
    var div = el.closest(".campo");
    if(div) div.classList.toggle("erro", ruim);
    el.setAttribute("aria-invalid", ruim ? "true" : "false");
  }
  function whatsValido(dig){
    if(!dig) return false;
    if(dig.charAt(0) === "0") return dig.length === 10 || dig.length === 11;
    if(dig.slice(0, 2) === "55") return dig.length >= 12 && dig.length <= 13;
    return dig.length >= 7 && dig.length <= 15;
  }
  function validarBase(){
    var ok = true, primeiro = null;
    if(!(nomeEl.value || "").trim()){ marcarErro(nomeEl, true); primeiro = primeiro || nomeEl; ok = false; } else marcarErro(nomeEl, false);
    var dig = (whatsEl.value || "").replace(/\D/g, "");
    if(!whatsValido(dig)){ marcarErro(whatsEl, true); primeiro = primeiro || whatsEl; ok = false; } else marcarErro(whatsEl, false);
    var email = (emailEl.value || "").trim();
    var emailOk = !email || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    if(!emailOk){ marcarErro(emailEl, true); primeiro = primeiro || emailEl; ok = false; } else marcarErro(emailEl, false);
    if(!ok) mostrarErro(t("erroValidacao"), primeiro); else limparErro();
    return ok;
  }
  [nomeEl, whatsEl, emailEl].forEach(function(el){
    el.addEventListener("input", function(){ marcarErro(el, false); });
  });

  /* ---------- máscara automática do WhatsApp (JP e BR) ---------- */
  function mascararWhats(valor){
    var d = (valor || "").replace(/\D/g, "");
    if(!d) return "";
    if(d.charAt(0) === "0"){
      var out = d.slice(0, 3);
      if(d.length >= 3) out += "-";
      out += d.slice(3, 7);
      if(d.length >= 7) out += "-";
      out += d.slice(7, 11);
      return out;
    }
    if(d.slice(0, 2) === "55" && d.length >= 12){
      var r = d.slice(4), p1 = r.length > 4 ? r.slice(0, r.length - 4) : r, p2 = r.length > 4 ? r.slice(-4) : "";
      return "+55 " + d.slice(2, 4) + (r ? " " + p1 : "") + (p2 ? "-" + p2 : "");
    }
    if(d.length >= 10){
      var r2 = d.slice(2), q1 = r2.length > 4 ? r2.slice(0, r2.length - 4) : r2, q2 = r2.length > 4 ? r2.slice(-4) : "";
      return d.slice(0, 2) + (r2 ? " " + q1 : "") + (q2 ? "-" + q2 : "");
    }
    return d;
  }
  whatsEl.addEventListener("input", function(){
    var v = mascararWhats(whatsEl.value);
    if(v !== whatsEl.value) whatsEl.value = v;
  });

  /* ---------- etapas do formulário no celular (2 ou 3, conforme o tamanho) ---------- */
  var etapaInd = document.getElementById("etapaInd");
  var extrasBEl = document.getElementById("formExtrasB");
  var extrasCEl = document.getElementById("formExtrasC");
  var passo4El = document.querySelector(".passo-4");
  var passo2El = document.querySelector(".passo-2");
  var passo3El = document.querySelector(".passo-3");
  var msgCampoEl = document.querySelector(".campo-msg");
  function syncEtapa(){
    var a = parseInt(form.getAttribute("data-etapa") || "1", 10);
    var b = parseInt(form.getAttribute("data-total") || "1", 10);
    form.classList.toggle("ultima-etapa", a >= b);
    etapaInd.textContent = t("fEtapa").replace("{a}", String(a)).replace("{b}", String(b));
  }
  function prepararEtapas(){
    while(extrasBEl.firstChild) extrasEl.appendChild(extrasBEl.firstChild);
    while(extrasCEl.firstChild) extrasEl.appendChild(extrasCEl.firstChild);
    passo2El.appendChild(msgCampoEl);
    var filhos = [...extrasEl.children];
    var unitStart = [];
    filhos.forEach(function(el, ix){
      if(el.classList.contains("campo") || el.classList.contains("ex-grupo")) unitStart.push(ix);
    });
    var U = unitStart.length;
    var mobile = window.matchMedia("(max-width: 640px)").matches;
    var passosExtras = (!mobile || U < 3) ? 0 : (U <= 3 ? 1 : (U <= 6 ? 2 : 3));
    var total = 1 + passosExtras;
    if(passosExtras >= 2){
      var per = Math.ceil(U / passosExtras);
      var bounds = [];
      for(var k = 1; k < passosExtras; k++) bounds.push(unitStart[Math.min(k * per, U - 1)]);
      var destinos = [extrasBEl, extrasCEl];
      for(var b = bounds.length - 1; b >= 0; b--){
        var dest = destinos[b];
        while(extrasEl.children.length > bounds[b]) dest.appendChild(extrasEl.children[bounds[b]]);
      }
      var passos = [passo2El, passo3El, passo4El];
      passos[total - 2].appendChild(msgCampoEl);
    }
    form.classList.toggle("modo-etapas", total > 1);
    form.setAttribute("data-total", String(total));
    form.setAttribute("data-etapa", "1");
    syncEtapa();
  }
  function avancarEtapa(){
    var a = parseInt(form.getAttribute("data-etapa") || "1", 10);
    if(a === 1 && !validarBase()) return;
    var b = parseInt(form.getAttribute("data-total") || "1", 10);
    if(a < b){ form.setAttribute("data-etapa", String(a + 1)); imperialEvento("form_step", { servico: currentService, etapa: a + 1 }); }
    syncEtapa();
    fundo.querySelector(".modal").scrollTop = 0;
  }
  document.getElementById("btnContinuar").addEventListener("click", avancarEtapa);
  document.getElementById("btnVoltar").addEventListener("click", function(){
    var a = parseInt(form.getAttribute("data-etapa") || "1", 10);
    if(a > 1) form.setAttribute("data-etapa", String(a - 1));
    syncEtapa();
    fundo.querySelector(".modal").scrollTop = 0;
  });

  var MSG_PH = {
    "geral-atendimento": "msgPhGeral", "geral-contato": "msgPhGeral", "geral-veiculos": "msgPhCompra",
    "geral-conexao": "msgPhConect", "geral-suporte": "msgPhGeral",
    "compra": "msgPhCompra", "kei": "msgPhCompra", "compacto": "msgPhCompra",
    "familia": "msgPhCompra", "sedan": "msgPhCompra", "suv": "msgPhCompra",
    "shaken": "msgPhShaken", "manut": "msgPhManut", "seguro": "msgPhSeguro",
    "financ": "msgPhFinanc", "leilao": "msgPhLeilao", "entrega": "msgPhEntrega",
    "fibra": "msgPhConect", "torre": "msgPhConect", "pocket": "msgPhConect",
    "trad": "msgPhTrad", "tradpresencial": "msgPhTrad", "tradfone": "msgPhTrad",
    "traddocs": "msgPhTrad", "orient": "msgPhTrad", "driveschool": "msgPhDrive"
  };
  function abrirForm(service, trigger){
    formTrigger = trigger;
    formVersion++;
    var novoServico = service || "geral-atendimento";
    if(novoServico !== currentService){ msgEl.value = ""; }
    currentService = novoServico;
    imperialEvento("form_start", { servico: currentService });
    limparErro();
    formOpenedAt = Date.now();
    formCampos.style.display = "";
    okBox.classList.remove("show");
    intEl.value = t(SERVICE_NAME_KEY[currentService] || "nGeralAtendimento");
    montarExtras(currentService, false);
    prepararEtapas();
    var ehTrad = ["trad", "tradpresencial", "tradfone", "traddocs"].indexOf(currentService) >= 0;
    document.getElementById("modalArte").hidden = !ehTrad;
    document.getElementById("modalCaixa").classList.toggle("com-arte", ehTrad);
    msgEl.placeholder = t(MSG_PH[currentService] || "msgPhGeral");
    subEl.textContent = service ? t("mSubClicked").replace("{x}", intEl.value) : t("mSub");
    fundo.classList.add("aberto");
    document.body.style.overflow = "hidden";
    fundo.querySelector(".modal").scrollTop = 0;
    nomeEl.focus({preventScroll:true});
  }
  function fecharForm(){
    if(!fundo.classList.contains("aberto")) return;
    fundo.classList.remove("aberto");
    document.body.style.overflow = "";
    if(formTrigger) formTrigger.focus({preventScroll:true});
  }
  document.querySelectorAll("[data-service]").forEach(function(el){
    el.addEventListener("click", function(){
      imperialEvento("service_click", { servico: el.getAttribute("data-service") });
      abrirForm(el.getAttribute("data-service"), el);
    });
  });
  document.getElementById("modalFechar").addEventListener("click", fecharForm);
  document.getElementById("okFecharBtn").addEventListener("click", fecharForm);
  fundo.addEventListener("click", function(e){ if(e.target === fundo) fecharForm(); });
  document.addEventListener("keydown", function(e){
    if(!fundo.classList.contains("aberto")) return;
    if(e.key === "Escape"){
      fecharForm();
      return;
    }
    if(e.key !== "Tab") return;
    var controles = Array.from(fundo.querySelectorAll("button, a[href], input, select, textarea"))
      .filter(function(el){ return !el.disabled && el.tabIndex >= 0 && el.getClientRects().length; });
    var borda = e.shiftKey ? controles[0] : controles[controles.length - 1];
    if(document.activeElement !== borda && fundo.contains(document.activeElement)) return;
    e.preventDefault();
    var destino = e.shiftKey ? controles[controles.length - 1] : controles[0];
    if(destino) destino.focus();
  });

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    if(enviando) return;
    if(form.classList.contains("modo-etapas") && !form.classList.contains("ultima-etapa")){ avancarEtapa(); return; }
    var nome = (nomeEl.value || "").trim();
    var whatsapp = (whatsEl.value || "").trim();
    var interesse = (intEl.value || "").trim();
    var mensagem = (msgEl.value || "").trim();
    var email = (emailEl.value || "").trim();
    if(!validarBase()) return;
    if(!validarExtras()){ mostrarErro(t("alertExtras")); return; }
    limparErro();
    var extrasTxt = coletarExtras();
    if(extrasTxt) mensagem = mensagem ? (extrasTxt + " | " + mensagem) : extrasTxt;

    var texto = t("waIntro").replace("{nome}", nome).replace("{interesse}", interesse);
    if(mensagem) texto += " " + mensagem;
    texto += " " + t("waPhone").replace("{whats}", whatsapp);
    document.getElementById("okWa").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(texto);

    var versaoEnviada = formVersion;
    enviando = true;
    btnEnviar.disabled = true;
    btnEnviar.querySelector("span").textContent = t("fEnviando");

    var payload = {
      nome: nome, whatsapp: whatsapp.replace(/\D/g, ""), interesse: interesse,
      servico: SERVICE_CANONICAL_PT[currentService] || interesse,
      origem: "site",
      idioma: currentLang === "ja" ? "jp" : currentLang,
      website: webEl.value || "",
      ts: formOpenedAt
    };
    if(mensagem) payload.mensagem = mensagem;
    if(email) payload.email = email;

    function terminar(sucesso){
      imperialEvento(sucesso ? "form_submit_success" : "form_submit_error", { servico: currentService });
      enviando = false;
      btnEnviar.disabled = false;
      btnEnviar.querySelector("span").textContent = t(currentService === "fibra" ? "fEnviarFibra" : "fEnviar");
      if(versaoEnviada !== formVersion) return;
      document.getElementById("okTitulo").textContent = sucesso ? t("okTitulo") : t("okFalhaTitulo");
      document.getElementById("okTexto").textContent = sucesso ? t("okTexto") : t("okFalhaTexto");
      formCampos.style.display = "none";
      okBox.classList.add("show");
      if(fundo.classList.contains("aberto")) document.getElementById("okFecharBtn").focus();
    }
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
    fetch(CAPTURE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if(timer) clearTimeout(timer);
      terminar(!!(res && res.ok));
    }).catch(function(){
      if(timer) clearTimeout(timer);
      terminar(false);
    });
  });

  document.getElementById("ano").textContent = String(new Date().getFullYear());
  var saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(e){}
  if(!saved){
    var browserLang = (navigator.language || "").toLowerCase().split(/[-_]/)[0];
    saved = browserLang === "fil" ? "tl" : (["pt", "en", "ja", "es", "tl"].indexOf(browserLang) !== -1 ? browserLang : "pt");
  }
  applyLang(saved);
})();
