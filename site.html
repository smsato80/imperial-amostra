<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Imperial Select | Veículos, conectividade, traduções e Drive School no Japão</title>
<meta name="description" content="Automóveis, internet, traduções e assessoria para habilitação, com atendimento em português em todo o Japão.">
<link rel="icon" href="assets/simbolo-mono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/imperial-hero.webp" media="(min-width: 768px)">
<style>
:root{
  --preto:#0B0D10; --grafite:#1A1E24; --grafite2:#22272F; --branco:#F5F3EE;
  --dourado:#B89A5A; --dourado-claro:#D6BC7E; --cinza:#8D949D; --cinza-claro:#C9CDD3;
  --linha:rgba(245,243,238,.09); --linha-forte:rgba(245,243,238,.16);
  --fonte-titulo:"Manrope","Noto Sans JP",sans-serif;
  --fonte-texto:"Inter","Noto Sans JP",sans-serif;
  --raio:14px; --max:1280px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--preto);color:var(--branco);font-family:var(--fonte-texto);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--fonte-titulo);line-height:1.14;letter-spacing:-.01em}
.micro{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--dourado);display:flex;align-items:center;gap:12px}
.micro::before{content:"";width:32px;height:1px;background:var(--dourado);flex:0 0 auto}
section{padding:104px 0}
.sec-head{max-width:720px;margin-bottom:48px}
.sec-head h2{font-size:clamp(32px,4.4vw,46px);font-weight:800;margin:16px 0 14px}
.sec-head p{color:var(--cinza-claro);font-size:17px}
/* ---------- header ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:60;transition:background .35s,border-color .35s,box-shadow .35s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(11,13,16,.92);backdrop-filter:blur(12px);border-bottom-color:var(--linha)}
.header-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:76px;display:flex;align-items:center;gap:28px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;flex:0 0 auto}
.marca img{height:36px;width:auto}
.marca .wm{line-height:1.05}
.marca .wm b{font-family:var(--fonte-titulo);font-weight:800;font-size:16.5px;letter-spacing:.22em;display:block}
.marca .wm span{font-size:9.5px;font-weight:600;letter-spacing:.52em;color:var(--dourado);display:block;margin-top:3px}
nav.principal{display:flex;gap:26px;margin-left:auto}
nav.principal a{text-decoration:none;font-size:13.5px;font-weight:600;letter-spacing:.04em;color:var(--cinza-claro);padding:6px 2px;border-bottom:2px solid transparent;transition:color .25s,border-color .25s}
nav.principal a:hover,nav.principal a.ativa{color:var(--branco);border-bottom-color:var(--dourado)}
.langs{display:flex;border:1px solid var(--linha-forte);border-radius:999px;overflow:hidden;flex:0 0 auto}
.langs button{background:transparent;border:0;color:var(--cinza);font:inherit;font-size:12px;font-weight:700;padding:7px 11px;cursor:pointer;letter-spacing:.03em}
.langs button.ativa{background:var(--branco);color:var(--preto)}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--fonte-texto);font-weight:700;font-size:15px;text-decoration:none;border-radius:999px;padding:13px 24px;cursor:pointer;border:1px solid transparent;transition:background .25s,color .25s,border-color .25s,transform .25s;line-height:1.2}
.btn-ouro{background:var(--dourado);color:#14161a}
.btn-ouro:hover{background:var(--dourado-claro)}
.btn-linha{border-color:rgba(245,243,238,.35);color:var(--branco);background:rgba(11,13,16,.25)}
.btn-linha:hover{border-color:var(--branco);background:rgba(245,243,238,.06)}
.btn-cta-header{padding:10px 18px;font-size:13.5px}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.menu-btn{display:none;margin-left:auto;background:transparent;border:1px solid var(--linha-forte);border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center;color:var(--branco);cursor:pointer}
.menu-btn svg{width:21px;height:21px}
.menu-mobile{display:none;border-top:1px solid var(--linha);background:rgba(11,13,16,.97);padding:10px 24px 22px}
.menu-mobile a{display:block;padding:13px 2px;text-decoration:none;font-weight:600;font-size:16px;border-bottom:1px solid var(--linha);color:var(--cinza-claro)}
.menu-mobile a:last-of-type{border-bottom:0}
.menu-mobile .langs{margin-top:14px;width:max-content}
header.menu-aberto .menu-mobile{display:block}
/* ---------- hero ---------- */
.hero{position:relative;padding-top:76px;background:var(--preto)}
.hero-wrap{position:relative;line-height:0;max-width:1920px;margin:0 auto}
.hero-wrap img{width:100%;height:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hotspot{position:absolute;display:block;border-radius:10px;z-index:3}
.hotspot:hover{background:rgba(184,154,90,.10);box-shadow:inset 0 0 0 2px rgba(184,154,90,.55)}
.hotspot:focus-visible{outline:3px solid var(--dourado);outline-offset:2px;background:rgba(184,154,90,.12)}
.hero-mobile{display:none}
.hero-ctas{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.hero-tel{margin-top:30px;display:flex;align-items:center;gap:10px;color:var(--cinza-claro);font-size:14.5px}
.hero-tel svg{width:17px;height:17px;color:var(--dourado)}
.hero-tel b{color:var(--branco);font-size:16.5px;letter-spacing:.02em}
@keyframes sobe{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero .anim{opacity:0;animation:sobe .8s cubic-bezier(.22,.7,.3,1) forwards}
.hero .anim.d1{animation-delay:.08s}.hero .anim.d2{animation-delay:.22s}.hero .anim.d3{animation-delay:.36s}.hero .anim.d4{animation-delay:.5s}.hero .anim.d5{animation-delay:.64s}
/* ---------- divisões ---------- */
#divisoes{padding-top:88px}
.grid-div{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card-div{position:relative;background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:border-color .3s}
.card-div:hover{border-color:rgba(184,154,90,.45)}
.card-div .foto{overflow:hidden;aspect-ratio:16/8.2}
.card-div .foto picture{display:block;width:100%;height:100%}
.card-div .foto img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,.7,.3,1)}
.card-div:hover .foto img{transform:scale(1.03)}
.card-div .corpo{padding:26px 28px 28px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-div .num{font-family:var(--fonte-titulo);font-size:12.5px;font-weight:800;letter-spacing:.2em;color:var(--dourado)}
.card-div h3{font-size:clamp(21px,2.4vw,25px);font-weight:800;display:flex;align-items:center;gap:12px}
.card-div h3 svg{width:22px;height:22px;color:var(--dourado);flex:0 0 auto}
.card-div p{color:var(--cinza-claro);font-size:15.5px;line-height:1.6}
.card-div .vai{margin-top:auto;padding-top:14px;display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--dourado-claro)}
.card-div .vai svg{width:16px;height:16px;transition:transform .3s}
.card-div:hover .vai svg{transform:translateX(5px)}
/* ---------- seções internas ---------- */
.alt{background:var(--grafite)}
.alt .servico{background:rgba(11,13,16,.35)}
.servicos{display:flex;flex-direction:column;border-top:1px solid var(--linha)}
.servico{display:flex;gap:20px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linha);color:inherit;font:inherit;padding:24px 10px;cursor:pointer;transition:background .25s}
.servico:hover{background:rgba(245,243,238,.03)}
.servico .ic{flex:0 0 auto;width:46px;height:46px;border:1px solid var(--linha-forte);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--dourado)}
.servico .ic svg{width:21px;height:21px}
.servico h3{font-size:19px;font-weight:700;margin-bottom:4px}
.servico p{color:var(--cinza);font-size:15px;line-height:1.6;max-width:56em}
.servico .seta{margin-left:auto;flex:0 0 auto;color:var(--cinza);padding-top:12px;transition:transform .3s,color .3s}
.servico:hover .seta{transform:translateX(5px);color:var(--dourado-claro)}
.servico .seta svg{width:19px;height:19px}
.duas-col{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:8px}
.tipo{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:22px;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:border-color .25s}
.alt .tipo{background:rgba(11,13,16,.35)}
.tipo:hover{border-color:rgba(184,154,90,.45)}
.tipo h3{font-size:17.5px;margin-bottom:6px}
.tipo p{color:var(--cinza);font-size:14px;line-height:1.55}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-top:44px}
.passo{padding:28px 24px;border-right:1px solid var(--linha);background:rgba(245,243,238,.015)}
.passo:last-child{border-right:0}
.passo .n{font-family:var(--fonte-titulo);font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--dourado)}
.passo h3{font-size:18px;margin:12px 0 8px}
.passo p{color:var(--cinza);font-size:14.5px;line-height:1.6}
.notas{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px}
.nota{border-left:2px solid var(--dourado);padding:4px 0 4px 18px}
.nota h3{font-size:16.5px;margin-bottom:5px}
.nota p{color:var(--cinza);font-size:14.5px;line-height:1.6}
.aviso{margin-top:26px;color:var(--cinza);font-size:14px;border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px;line-height:1.6}
/* ---------- drive school ---------- */
.painel-sim{background:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:34px;position:sticky;top:104px}
.painel-sim h3{font-size:23px;margin-bottom:10px}
.painel-sim p{color:var(--cinza-claro);font-size:15.5px;line-height:1.65}
.painel-sim .btn{margin-top:22px;width:100%;justify-content:center}
.painel-sim .regra{display:flex;gap:14px;margin-top:24px;padding-top:22px;border-top:1px solid var(--linha)}
.painel-sim .regra .big{font-family:var(--fonte-titulo);font-size:30px;font-weight:800;color:var(--dourado);line-height:1}
.painel-sim .regra p{font-size:13.5px;color:var(--cinza)}
/* ---------- contato ---------- */
#contato{background:var(--grafite)}
.contato-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center}
.contato-grid h2{font-size:clamp(30px,4vw,42px);margin:16px 0 14px}
.contato-grid .lead{color:var(--cinza-claro);font-size:17px;max-width:32em}
.tel-grande{font-family:var(--fonte-titulo);font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:.02em;margin:26px 0 6px}
.tel-label{color:var(--cinza);font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.contato-ctas{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
.qr-card{background:var(--preto);border:1px solid var(--linha);border-radius:var(--raio);padding:26px;text-align:center}
.qr-card img{width:172px;height:172px;margin:0 auto 14px;border-radius:10px}
.qr-card p{color:var(--cinza);font-size:13.5px;line-height:1.55}
/* ---------- rodapé ---------- */
footer{border-top:1px solid var(--linha);padding:64px 0 34px;background:var(--preto)}
.rodape-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:44px}
.rodape-grid img.logo-full{width:118px;height:auto;margin-bottom:16px}
.rodape-grid .slogan{font-family:var(--fonte-titulo);font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--dourado)}
.rodape-grid p{color:var(--cinza);font-size:14.5px;margin-top:12px;max-width:26em}
.rodape-grid h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinza);margin-bottom:16px}
.rodape-grid ul{list-style:none}
.rodape-grid li{margin-bottom:10px}
.rodape-grid ul a{color:var(--cinza-claro);text-decoration:none;font-size:15px}
.rodape-grid ul a:hover{color:var(--branco)}
.direitos{margin-top:48px;padding-top:22px;border-top:1px solid var(--linha);color:var(--cinza);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* ---------- modal ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(6px);z-index:90;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-fundo.aberto{display:flex}
.modal{background:var(--grafite);width:100%;max-width:560px;max-height:92svh;overflow-y:auto;border-radius:20px 20px 0 0;padding:32px 30px 36px;border:1px solid var(--linha-forte);border-bottom:0}
@media(min-width:640px){.modal-fundo{align-items:center;padding:24px}.modal{border-radius:20px;border-bottom:1px solid var(--linha-forte)}}
.modal .topo{display:flex;align-items:flex-start;gap:16px}
.modal h2{font-size:24px}
.modal .sub{color:var(--cinza);font-size:14.5px;margin-top:6px;line-height:1.55}
.fechar{margin-left:auto;background:transparent;border:1px solid var(--linha-forte);width:40px;height:40px;border-radius:10px;color:var(--branco);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.fechar svg{width:18px;height:18px}
.campo{margin-top:18px}
.campo label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--cinza-claro)}
.campo .help{font-weight:400;color:var(--cinza);font-size:12.5px}
.campo input,.campo textarea{width:100%;background:var(--preto);border:1px solid var(--linha-forte);border-radius:10px;color:var(--branco);font:inherit;font-size:16px;padding:13px 14px;transition:border-color .2s, box-shadow .2s}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--dourado);box-shadow:0 0 0 3px rgba(184,154,90,.18)}
.campo textarea{resize:vertical;min-height:84px}
.modal .btn{width:100%;justify-content:center;margin-top:24px}
.modal .nota-form{color:var(--cinza);font-size:13px;margin-top:14px;line-height:1.55;text-align:center}
.ok-box{display:none;text-align:center;padding:12px 0 4px}
.ok-box.show{display:block}
.ok-box .check{width:58px;height:58px;border:1px solid var(--dourado);border-radius:50%;margin:8px auto 18px;display:flex;align-items:center;justify-content:center;color:var(--dourado)}
.ok-box .check svg{width:26px;height:26px}
.ok-box h3{font-size:22px;margin-bottom:8px}
.ok-box p{color:var(--cinza-claro);font-size:15px;line-height:1.6}
.armadilha{position:absolute;left:-9999px;top:-9999px;height:1px;width:1px;opacity:0}
/* ---------- reveal ---------- */
.revela{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.22,.7,.3,1),transform .6s cubic-bezier(.22,.7,.3,1)}
.revela.visto{opacity:1;transform:none}
/* ---------- responsivo ---------- */
@media(max-width:1020px){
  nav.principal{display:none}
  .menu-btn{display:flex}
  header .btn-cta-header{display:none}
  .passos{grid-template-columns:1fr 1fr}
  .passo:nth-child(2){border-right:0}
  .passo:nth-child(1),.passo:nth-child(2){border-bottom:1px solid var(--linha)}
  .notas{grid-template-columns:1fr}
  .duas-col{grid-template-columns:1fr;gap:40px}
  .painel-sim{position:static}
  .contato-grid{grid-template-columns:1fr;gap:40px}
  .rodape-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  body{font-size:16px}
  section{padding:72px 0}
  .wrap{padding:0 18px}
  .header-in{padding:0 18px;height:66px;gap:14px}
  .marca img{height:30px}
  .marca .wm b{font-size:14.5px}
  .langs button{padding:6px 8px;font-size:11.5px}
  .grid-div{grid-template-columns:1fr}
  .card-div .corpo{padding:22px}
  .passos{grid-template-columns:1fr}
  .passo{border-right:0;border-bottom:1px solid var(--linha)}
  .passo:last-child{border-bottom:0}
  .servico{padding:20px 4px;gap:14px}
  .servico .ic{width:40px;height:40px}
  .rodape-grid{grid-template-columns:1fr}
  .hero-ctas{flex-direction:column;align-items:stretch}
  .hotspot{display:none}
  .hero-mobile{display:block;padding:24px 0 4px}
  .hero-mobile .hero-ctas{margin-top:0}
  .hero-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .hero-links a{display:flex;align-items:center;gap:10px;border:1px solid var(--linha-forte);border-radius:12px;padding:13px 14px;text-decoration:none;font-weight:600;font-size:15px;color:var(--branco)}
  .hero-links svg{width:19px;height:19px;color:var(--dourado);flex:0 0 auto}
  .hero-ctas .btn{justify-content:center;padding:15px 20px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hero .anim{animation:none;opacity:1}
  .revela{opacity:1;transform:none;transition:none}
  .card-div .foto img,.servico .seta,.card-div .vai svg{transition:none}
}
</style>
</head>
<body>

<header id="topo">
  <div class="header-in">
    <a class="marca" href="#inicio" aria-label="Imperial Select">
      <img src="assets/simbolo-mono.png" alt="" width="86" height="36">
      <span class="wm"><b>IMPERIAL</b><span>SELECT</span></span>
    </a>
    <nav class="principal" aria-label="Principal">
      <a href="#inicio" data-i18n="navInicio"></a>
      <a href="#veiculos" data-i18n="navVeiculos"></a>
      <a href="#conectividade" data-i18n="navConect"></a>
      <a href="#traducoes" data-i18n="navTrad"></a>
      <a href="#driveschool" data-i18n="navDrive"></a>
      <a href="#contato" data-i18n="navContato"></a>
    </nav>
    <div class="langs" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ja">日本語</button>
    </div>
    <button type="button" class="btn btn-ouro btn-cta-header" data-service="geral-atendimento"><span data-i18n="heroCta2"></span></button>
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
  </div>
  <div class="menu-mobile" id="menuMobile">
    <a href="#inicio" data-i18n="navInicio"></a>
    <a href="#veiculos" data-i18n="navVeiculos"></a>
    <a href="#conectividade" data-i18n="navConect"></a>
    <a href="#traducoes" data-i18n="navTrad"></a>
    <a href="#driveschool" data-i18n="navDrive"></a>
    <a href="#contato" data-i18n="navContato"></a>
  </div>
</header>

<main>
<!-- HERO -->
<section class="hero" id="inicio">
  <h1 class="sr-only" data-i18n="heroH1"></h1>
  <p class="sr-only" data-i18n="heroSub"></p>
  <div class="hero-wrap">
    <picture>
      <source srcset="assets/imperial-hero.webp" type="image/webp">
      <img src="assets/imperial-hero.png" data-i18n-alt="heroAlt" alt="" fetchpriority="high" width="1774" height="887">
    </picture>
    <a class="hotspot" style="left:3.4%;top:62.6%;width:23%;height:9.4%" href="#divisoes" data-i18n-aria="heroCta1"></a>

      entries.forEach(function(en){
        if(en.isIntersecting){
          Object.values(navMap).forEach(function(a){ a.classList.remove("ativa"); });
          var a = navMap[en.target.id]; if(a) a.classList.add("ativa");
        }
      });
    }, {rootMargin:"-40% 0px -55% 0px"});
    ["inicio","veiculos","conectividade","traducoes","driveschool","contato"].forEach(function(id){
      var el = document.getElementById(id); if(el) ioNav.observe(el);
    });
  }

  /* reveal */
  var revelaEls = document.querySelectorAll(".revela");
  if("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    var ioDisparou = false;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ ioDisparou = true; en.target.classList.add("visto"); io.unobserve(en.target); } });
    }, {threshold: 0.05, rootMargin: "0px 0px 60px 0px"});
    revelaEls.forEach(function(el){ io.observe(el); });
    /* Trava de segurança: se o observador não disparar (webview/print), nada fica invisível. */
    setTimeout(function(){
      if(!ioDisparou){ revelaEls.forEach(function(el){ el.classList.add("visto"); }); }
    }, 4000);
  } else {
    revelaEls.forEach(function(el){ el.classList.add("visto"); });
  }

  /* ---------- modal + formulário ---------- */
  var fundo = document.getElementById("modalFundo");
  var form = document.getElementById("formContato");
  var formCampos = document.getElementById("formCampos");
  var okBox = document.getElementById("okBox");
  var nomeEl = document.getElementById("fieldNome");
  var whatsEl = document.getElementById("fieldWhatsapp");
  var intEl = document.getElementById("fieldInteresse");
  var msgEl = document.getElementById("fieldMensagem");
  var webEl = document.getElementById("fieldWebsite");
  var subEl = document.getElementById("modalSub");
  var btnEnviar = document.getElementById("btnEnviar");

  function abrirForm(service){
    currentService = service || "geral-atendimento";
    formOpenedAt = Date.now();
    formCampos.style.display = "";
    okBox.classList.remove("show");
    intEl.value = t(SERVICE_NAME_KEY[currentService] || "nGeralAtendimento");
    subEl.textContent = service ? t("mSubClicked").replace("{x}", intEl.value) : t("mSub");
    fundo.classList.add("aberto");
    document.body.style.overflow = "hidden";
    setTimeout(function(){ nomeEl.focus(); }, 60);
  }
  function fecharForm(){
    fundo.classList.remove("aberto");
    document.body.style.overflow = "";
  }
  document.querySelectorAll("[data-service]").forEach(function(el){
    el.addEventListener("click", function(){ abrirForm(el.getAttribute("data-service")); });
  });
  document.getElementById("modalFechar").addEventListener("click", fecharForm);
  document.getElementById("okFecharBtn").addEventListener("click", fecharForm);
  fundo.addEventListener("click", function(e){ if(e.target === fundo) fecharForm(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") fecharForm(); });

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    if(enviando) return;
    var nome = (nomeEl.value || "").trim();
    var whatsapp = (whatsEl.value || "").trim();
    var interesse = (intEl.value || "").trim();
    var mensagem = (msgEl.value || "").trim();
    if(!nome || !whatsapp || !interesse){ alert(t("alertFill")); return; }

    var texto = t("waIntro").replace("{nome}", nome).replace("{interesse}", interesse);
    if(mensagem) texto += " " + mensagem;
    texto += " " + t("waPhone").replace("{whats}", whatsapp);
    document.getElementById("okWa").href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(texto);

    enviando = true;
    btnEnviar.disabled = true;
    btnEnviar.querySelector("span").textContent = t("fEnviando");

    var payload = {
      nome: nome, whatsapp: whatsapp, interesse: interesse,
      servico: SERVICE_CANONICAL_PT[currentService] || interesse,
      origem: "site",
      idioma: currentLang === "ja" ? "jp" : currentLang,
      website: webEl.value || "",
      ts: formOpenedAt
    };
    if(mensagem) payload.mensagem = mensagem;

    function terminar(sucesso){
      enviando = false;
      btnEnviar.disabled = false;
      btnEnviar.querySelector("span").textContent = t("fEnviar");
      document.getElementById("okTitulo").textContent = sucesso ? t("okTitulo") : t("okFalhaTitulo");
      document.getElementById("okTexto").textContent = sucesso ? t("okTexto") : t("okFalhaTexto");
      formCampos.style.display = "none";
      okBox.classList.add("show");
    }
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 12000) : null;
    fetch(CAPTURE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if(timer) clearTimeout(timer);
      terminar(!!(res && res.ok));
    }).catch(function(){
      if(timer) clearTimeout(timer);
      terminar(false);
    });
  });

  document.getElementById("ano").textContent = String(new Date().getFullYear());
  var saved = "pt";
  try{ saved = localStorage.getItem(LANG_KEY) || "pt"; }catch(e){}
  applyLang(saved);
})();

</script>
</body>
</html>
